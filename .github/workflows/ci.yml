name: ci

on:
  push:
  pull_request:

jobs:
  test:
    name: ruff + pytest (no model download)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install core + dev (numpy only at runtime)
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests — the air-gap guard and offline retrieval; the model smoke test skips itself
        run: pytest -q
      - name: Retrieval demo runs offline without a model
        run: python demos/demo_rag.py "What was Musicolour?"
